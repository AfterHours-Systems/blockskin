# Publishes the package to npm when a GitHub release is published.
#
# It uses npm trusted publishing: npm verifies this workflow through GitHub's
# OIDC token, so no npm token is stored anywhere, and every version carries a
# provenance statement linking it to this run. Set it up once on npmjs.com
# (package settings, "Trusted publisher": this repository and release.yml).
#
# Third-party actions are pinned to a commit SHA, as GitHub recommends; the
# comment beside each names the release it points at.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the release tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json ($version)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the package contents
        run: node scripts/check_package.mjs

      # Pre-releases (versions like 0.1.0-alpha.1) go out under the npm tag
      # named after them, so `npm install` keeps resolving to the latest
      # stable version. A version already on npm (for example the very first
      # one, which has to be published by hand before trusted publishing can
      # be set up) is skipped instead of failing the run.
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          case "$version" in
            *-*) tag="$(echo "${version#*-}" | cut -d. -f1)" ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"
